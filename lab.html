<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="저장소 복제부터 지수의 검토와 병합, 이슈 할당과 충돌 해결까지 직접 배우는 GitHub 실습">
  <title>GitHub 협업 실습실 — ANY</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="lab.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><img src="assets/brand/any-logo-mono-reference.jpg" width="48" height="48" alt="ANY"><span>GitHub 온보딩 <b>협업 실습실</b></span></a><a class="slides-link" href="index.html">슬라이드 보기 ↗</a></header>
  <main>
    <div class="page-heading"><h1>백설공주, 함께 이어쓰기</h1><span class="simulation">교육용 시뮬레이션</span></div>
    <div class="lesson-tabs" role="tablist" aria-label="실습 선택">
      <button id="mode-mission" role="tab" aria-selected="true" aria-controls="workshop">2D 협업지도</button>
      <button id="mode-coordination" role="tab" aria-selected="false" aria-controls="workshop" tabindex="-1">이슈/충돌 실습</button>
      <button id="mode-combined" role="tab" aria-selected="false" aria-controls="workshop" tabindex="-1">협업+이슈/충돌 실습</button>
    </div>
    <div class="lesson-heading"><h2 id="lesson-title"></h2><div class="people"><span><i class="avatar">나</i> 수정·충돌 해결</span><span><i class="avatar jisu">지수</i> 검토·승인·병합</span></div></div>
    <details class="role-explanation"><summary>이 실습의 역할 설정</summary><p id="role-note"></p><p>지수는 정해진 동작과 의견을 보여 주는 가상 인물입니다.</p></details>
    <p id="error-message" class="error-message" role="alert" hidden></p>
    <section id="workshop" role="tabpanel" aria-labelledby="mode-mission"></section>
  </main>
  <dialog id="file-dialog" aria-labelledby="file-title"><div class="dialog-heading"><h2 id="file-title"></h2><button id="file-close" class="close" aria-label="본문 수정 창 닫기">×</button></div><div id="file-body"></div><p class="dialog-instruction">“이 문장 저장하기” 버튼을 누르세요.</p><button id="file-save" class="primary">이 문장 저장하기</button></dialog>
  <dialog id="record-dialog" aria-labelledby="record-title"><div class="dialog-heading"><h2 id="record-title"></h2><button id="record-close" class="close" aria-label="기록 내용 닫기">×</button></div><p id="record-location"></p><div class="file-name">snow-white.md</div><pre id="record-content"></pre><p id="record-parents"></p></dialog>
  <dialog id="change-dialog" class="change-dialog" aria-labelledby="change-title"></dialog>
  <noscript><p>이 실습은 JavaScript가 필요합니다. <a href="index.html">슬라이드 보기</a></p></noscript>
  <script type="module" src="lab.js"></script>
</body>
</html>
