<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>GitHub 협업 흐름: 교육용 시뮬레이션</title><link rel="stylesheet" href="../../slides.css"><script src="../../demo.js"></script><style>html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#fff}main{padding:48px 64px}h1{font-size:48px;line-height:1.2;margin:12px 0 34px}.eyebrow{font-size:20px;color:#566151}.scene{width:1152px;height:340px}.scene svg{width:100%;height:100%;font-family:Pretendard}.caption{font-size:30px;color:#101d14;margin-top:24px}.progress{display:flex;gap:12px;margin-top:38px}.segment{height:7px;flex:1;background:#d9dfda}.segment.active{background:#a1b61c}.foot{display:flex;justify-content:space-between;font-size:16px;color:#566151;margin-top:16px}.caption{position:absolute;left:64px;right:64px;bottom:108px;height:88px;margin:0;padding:7px 16px;background:#101d14;color:#fff;font-size:30px;line-height:1.3;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line}.progress{position:absolute;left:64px;right:64px;bottom:80px;margin:0}.foot{position:absolute;left:64px;right:64px;bottom:48px;margin:0}</style></head><body><main><div class="eyebrow">FAQ 한 항목의 변경 이력</div><h1 id="title">01 · Branch</h1><div class="scene" id="scene"></div><p class="caption" id="caption"></p><div class="progress" id="progress"></div><div class="foot"><span>교육용 시뮬레이션 · 실제 GitHub 조작 녹화와 구분</span><span id="time">00:00 / 00:30</span></div></main><script>const subtitles=["먼저 main에서 작업 브랜치를 만듭니다.\n공동 기준을 건드리지 않고 수정할 공간입니다.", "FAQ를 수정하고 commit으로 기록합니다.\n이 변경은 아직 내 컴퓨터에만 있습니다.", "Push하면 commit이 GitHub 작업 브랜치에 반영됩니다.\n이때 main은 그대로입니다.", "PR을 열어 작업 브랜치의 변경을\nmain에 합쳐 달라고 제안합니다.", "리뷰어가 변경을 검토하고, 필요한 승인과\n검사 조건을 확인합니다.", "Merge하면 변경이 GitHub main에 반영됩니다.\n이후 pull로 내 컴퓨터의 main도 갱신합니다."];window.renderAt=(ms)=>{const t=Math.min(29999,Math.max(0,ms)),step=Math.floor(t/5000),part=(t%5000)/5000,spec=GitVisuals.specs.full;document.querySelector('#title').textContent=String(step+1).padStart(2,'0')+' · '+spec.steps[step];document.querySelector('#scene').innerHTML=GitVisuals.diagram('full',step,part);document.querySelector('#caption').textContent=subtitles[step];document.querySelector('#progress').innerHTML=spec.steps.map((s,i)=>'<span class="segment '+(i<=step?'active':'')+'"></span>').join('');document.querySelector('#time').textContent='00:'+String(Math.floor(t/1000)).padStart(2,'0')+' / 00:30';};renderAt(0);</script></body></html>
